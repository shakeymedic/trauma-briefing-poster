<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trauma Team Brief Poster V3</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@1.52.0"></script>

    <!-- Google Fonts: Inter (UI) & Archivo Black (Headlines) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&family=Archivo+Black&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Archivo Black', 'sans-serif'],
                    },
                    colors: {
                        'nhs-blue': '#005EB8',
                        'nhs-dark-blue': '#003087',
                        'nhs-bright-blue': '#0072CE',
                        'alert-red': '#DA291C',
                        'safe-green': '#009639',
                        'dark-slate': '#231f20',
                    }
                }
            }
        }
    </script>

    <style>
        /* A3 Print Specifics */
        @media print {
            @page {
                size: A3 portrait;
                margin: 0mm;
            }
            body {
                background-color: white;
                margin: 0;
                padding: 0;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .no-print {
                display: none !important;
            }
            #root {
                width: 100%;
                max-width: none;
                height: 100vh;
            }
            .poster-container {
                height: 100vh !important;
                box-shadow: none !important;
                border: none !important;
            }
        }

        .a3-ratio {
            aspect-ratio: 297/420;
        }
        
        /* Phone layout: stack the panels in one column on narrow screens.
           Screen only, so printing (from any device) still uses the A3 layout above. */
        @media screen and (max-width: 819px) {
            #root { padding-bottom: 5rem; }
            #root .poster-container { aspect-ratio: auto; }
            #root .poster-header { padding: 1.25rem; }
            #root .poster-title { font-size: 2.75rem; }
            #root .poster-subtitle { font-size: 0.875rem; }
            #root .poster-body { flex-direction: column; }
            #root .poster-sidebar,
            #root .poster-main { width: 100%; padding: 1.25rem; }
            #root .poster-steps { height: auto; padding-bottom: 1rem; }
            #root .team-connector { display: none; }
            #root .poster-grid { grid-template-columns: 1fr; gap: 1rem; }
            #root .poster-grid h3 { font-size: 1.5rem; padding-right: 2.5rem; }
            #root .print-button { bottom: 1rem; right: 1rem; padding: 0.75rem 1.25rem; }
        }

        /* Custom dotted pattern for the "Connect" line */
        .dots-pattern {
            background-image: radial-gradient(#94a3b8 1px, transparent 1px);
            background-size: 8px 8px;
        }
    </style>
</head>
<body class="bg-gray-200 min-h-screen flex flex-col items-center justify-center p-4 print:p-0">

    <div id="root" class="w-full max-w-[1123px] print:max-w-none"></div>

    <!-- poster.js is built from poster.jsx. After editing poster.jsx, run ./build.sh (see README.md). -->
    <script src="poster.js"></script>
</body>
</html>
